<!doctype html>
<!--
  Open Graph card template (1200x630). scripts/og/build.mjs copies this
  file once per page, swapping the OG_DATA block below for that page's
  data, then renders it to public/og/<slug>.png with headless Chrome.

  Brand: navy #1E3D8C / #162D66 background, white type, gold #F5C518 as
  the one accent (the rule above the headline), Fraunces headlines and
  Inter body (same as src/app/layout.tsx), the Write In Cuteri wordmark
  and the ACP eagle from public/images.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(135deg, #1E3D8C 0%, #1E3D8C 45%, #162D66 100%);
    color: #fff;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { position: absolute; inset: 0; display: flex; }
  .text {
    position: relative; z-index: 2;
    width: 680px; height: 630px;
    padding: 64px 0 60px 72px;
    display: flex; flex-direction: column;
  }
  .wordmark { display: flex; align-items: baseline; gap: 14px; font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
  .wordmark .wi { font-size: 22px; letter-spacing: 7px; color: #fff; opacity: .85; }
  .wordmark .cu { font-size: 34px; letter-spacing: 4px; color: #fff; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .rule { width: 88px; height: 8px; background: #F5C518; border-radius: 4px; margin-bottom: 28px; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: 74px; line-height: 1.04; letter-spacing: -0.5px;
    color: #fff; max-width: 600px; text-wrap: balance;
  }
  h1.long { font-size: 66px; }
  .sub { margin-top: 24px; font-size: 32px; line-height: 1.3; color: rgba(255,255,255,.88); max-width: 580px; font-weight: 500; text-wrap: balance; }
  .foot { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 600; color: rgba(255,255,255,.82); }
  .foot img { height: 50px; width: auto; }
  .art { position: absolute; z-index: 1; top: 0; right: 0; width: 560px; height: 630px; }
  .art.photo img { width: 100%; height: 100%; object-fit: cover; }
  .art.photo::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(90deg, #1E3D8C 0%, rgba(30,61,140,.75) 14%, rgba(30,61,140,0) 42%);
  }
  .art.center { display: flex; align-items: center; justify-content: center; }
  /* Ballot graphic for /write-in */
  .ballot {
    width: 430px; background: #FAF8F2; color: #1A1A1A; border-radius: 14px;
    padding: 30px 32px 34px; box-shadow: 0 20px 50px rgba(0,0,0,.35); transform: rotate(-2deg);
  }
  .ballot .race { font-size: 19px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #1A1A1A; }
  .ballot .race small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; text-transform: none; margin-top: 4px; color: #444; }
  .ballot .row { margin-top: 26px; display: flex; align-items: center; gap: 18px; }
  .ballot .oval { width: 44px; height: 26px; border: 3px solid #1A1A1A; border-radius: 50%; background: #1A1A1A; flex: none; }
  .ballot .line { flex: 1; border-bottom: 3px solid #1A1A1A; padding-bottom: 2px; font-family: "Caveat", cursive; font-weight: 600; font-size: 54px; line-height: 1; color: #1E3D8C; white-space: nowrap; }
  .ballot .label { margin-top: 8px; margin-left: 62px; font-size: 15px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
  .bignum { font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 360px; line-height: 1; color: rgba(255,255,255,.95); letter-spacing: -10px; }
  .bignum-cap { font-size: 26px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,.8); text-align: center; margin-top: -6px; }
  .eagle img { width: 440px; height: auto; }
  .map svg { width: 520px; height: auto; }
</style>
</head>
<body>
<script id="og-data" type="application/json">/*OG_DATA*/</script>
<div class="card">
  <div class="text">
    <div class="wordmark"><span class="wi">CLAYTON</span><span class="cu">CUTERI</span></div>
    <div class="main">
      <div class="rule"></div>
      <h1 id="h"></h1>
      <p class="sub" id="s"></p>
    </div>
    <div class="foot"><img id="eagle-small" alt=""><span>writeincuteri.com</span></div>
  </div>
  <div class="art" id="art"></div>
</div>
<script>
  const d = JSON.parse(document.getElementById("og-data").textContent);
  const h = document.getElementById("h");
  h.textContent = d.headline;
  if (d.headline.length > 30) h.classList.add("long");
  document.getElementById("s").textContent = d.sub;
  document.getElementById("eagle-small").src = d.root + "/public/images/ACP_Eagle_white_outline.png";
  const art = document.getElementById("art");
  if (d.art.kind === "photo") {
    art.classList.add("photo");
    const img = new Image();
    img.src = d.root + "/public/images/" + d.art.file;
    img.style.objectPosition = d.art.position || "center";
    art.appendChild(img);
  } else if (d.art.kind === "ballot") {
    art.classList.add("center");
    art.innerHTML = '<div class="ballot"><div class="race">U.S. House of Representatives<small>District 1 · Vote for one</small></div>' +
      '<div class="row"><span class="oval"></span><span class="line">Clayton Cuteri</span></div>' +
      '<div class="label">Write-in</div></div>';
  } else if (d.art.kind === "number") {
    art.classList.add("center");
    art.innerHTML = '<div><div class="bignum">' + d.art.value + '</div><div class="bignum-cap">' + d.art.caption + '</div></div>';
  } else if (d.art.kind === "eagle") {
    art.classList.add("center", "eagle");
    art.innerHTML = '<img src="' + d.root + '/public/images/ACP_Eagle_white_outline.png" alt="">';
  } else if (d.art.kind === "map") {
    art.classList.add("center", "map");
    art.innerHTML = '<svg viewBox="24 22 402 356" xmlns="http://www.w3.org/2000/svg"><path d="' + d.art.path +
      '" fill="rgba(255,255,255,0.14)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  }
</script>
</body>
</html>
